workflows:
  firebase-deploy:
    name: TravelMatch — Firebase Rules Deploy
    max_build_duration: 15
    instance_type: linux
    environment:
      groups:
        # Codemagic UI'da oluşturulan grup — bkz. DEPLOYMENT.md "Firebase deploy (Mac'siz)".
        - firebase_deploy_credentials   # FIREBASE_SERVICE_ACCOUNT_BASE64, FIREBASE_PROJECT_ID
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Servis hesabı anahtarını çöz
        script: |
          echo $FIREBASE_SERVICE_ACCOUNT_BASE64 | base64 --decode > $CM_BUILD_DIR/service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CM_BUILD_DIR/service-account.json" >> $CM_ENV

      - name: Firebase CLI'ı kur
        script: npm install -g firebase-tools

      - name: Firestore kurallarını deploy et
        script: |
          firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

    publishing:
      email:
        recipients:
          - umut.gurrkann@icloud.com
        notify:
          success: false
          failure: true

  ios-app-store:
    name: TravelMatch — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic Team Settings > Integrations > Developer Portal altında bağlanan
      # App Store Connect API key entegrasyonunun adı (bkz. DEPLOYMENT.md adım 4).
      app_store_connect: travelmatch_api_key
    environment:
      groups:
        # Codemagic UI > Team/Application > Environment variables altındaki gruplar.
        # İçerikleri için DEPLOYMENT.md'ye bak.
        - firebase_config          # GOOGLE_SERVICE_INFO_PLIST_BASE64
        - app_signing              # BUNDLE_ID
        - certificate_credentials  # CERTIFICATE_PRIVATE_KEY
      vars:
        XCODE_SCHEME: "TravelMatch"
        XCODE_PROJECT: "TravelMatch.xcodeproj"
        APP_VERSION: "1.0"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Firebase yapılandırma dosyasını çöz
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST_BASE64 | base64 --decode > $CM_BUILD_DIR/TravelMatch/GoogleService-Info.plist

      - name: XcodeGen'i kur
        script: brew install xcodegen

      - name: .xcodeproj'u project.yml'den üret
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Swift Package bağımlılıklarını çöz
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/SourcePackages"

      - name: Keychain'i imzalama için hazırla
        script: keychain initialize

      - name: App Store Connect'ten imzalama dosyalarını çek
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Sertifikayı keychain'e ekle
        script: keychain add-certificates

      - name: Xcode projesine imzalama ayarlarını uygula
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build numarasını hesapla
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          BUILD_NO=$((LATEST + 1))
          echo "Yeni build numarası: $BUILD_NO"
          echo "BUILD_NO=$BUILD_NO" >> $CM_ENV

      - name: .ipa oluştur
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs="CODE_SIGN_STYLE=Manual CURRENT_PROJECT_VERSION=$BUILD_NO MARKETING_VERSION=$APP_VERSION" \
            --archive-flags="-clonedSourcePackagesDirPath $CM_BUILD_DIR/SourcePackages -skipPackagePluginValidation -skipMacroValidation"

      - name: IPA doğrulaması (sürüm + ikon)
        script: |
          set -e
          rm -rf /tmp/ipacheck
          unzip -o -q build/ios/ipa/*.ipa -d /tmp/ipacheck
          APP_DIR=$(ls -d /tmp/ipacheck/Payload/*.app)

          echo "--- Sürüm ---"
          plutil -p "$APP_DIR/Info.plist" | grep -E "CFBundleVersion|CFBundleShortVersionString"

          echo "--- App icon ---"
          if ls "$APP_DIR" | grep -q "AppIcon60x60@2x.png"; then
            echo "120x120 ikon bulundu."
          else
            echo "HATA: 120x120 app icon eksik — yükleme reddedilir."
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      # Build başarılı olunca TestFlight'a yüklenir (dahili test için hemen kullanılabilir).
      # App Store'a canlı yayına gönderme adımı bilinçli olarak elle bırakıldı:
      # ekran görüntüsü, açıklama, gizlilik anketi gibi meta verileri App Store
      # Connect'te doldurup incelemeye SEN göndermelisin (bkz. DEPLOYMENT.md).
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - umut.gurrkann@icloud.com
        notify:
          success: true
          failure: true
