name: TravelMatch
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
targets:
  TravelMatch:
    type: application
    platform: iOS
    sources:
      - path: TravelMatch
    entitlements:
      path: Generated/TravelMatch.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: production
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.wore.travelmatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TravelMatch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Biniş kartını veya rezervasyon belgeni taramak için kameraya ihtiyacımız var."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Sohbette fotoğraf paylaşabilmen için galerine erişim gerekiyor."
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
schemes:
  TravelMatch:
    build:
      targets:
        TravelMatch: all
    run:
      config: Debug
    archive:
      config: Release
